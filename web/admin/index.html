<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LeoBridge · 主题管理</title><link rel="icon" type="image/svg+xml" href="/logo.svg"><link rel="stylesheet" href="/styles.css"></head><body>
<div class="shell"><aside><a class="brand" href="/" aria-label="LeoBridge 首页"><img src="/logo.svg" alt="" width="36" height="36"><span>LeoBridge</span></a><p class="eyebrow">主题管理</p><nav><button data-view="installed" class="selected">已安装主题</button><button data-view="cfsm">CFSM 商店 <span>↗</span></button><button data-view="komari">Komari 商店 <span>↗</span></button></nav><div class="sidebar-bottom"><span class="dot"></span> 独立管理站<br><small>采集和服务器管理由妙妙屋X负责</small><button id="logout" hidden>退出登录</button></div></aside>
<main><header><div><p class="eyebrow">LEOBRIDGE / THEMES</p><h1 id="heading">主题工作台</h1><p id="subtitle">安装一次，预览后切换。保留每个版本，随时回退。</p></div><a id="display-link" class="button secondary" target="_blank" rel="noopener noreferrer" hidden>打开展示站 ↗</a></header>
<div id="notice" role="status" hidden></div>
<section id="login" class="login panel" hidden><img class="mark" src="/logo.svg" alt="LeoBridge" width="56" height="56"><h2>登录主题管理</h2><p>管理凭据独立于展示站和妙妙屋X。</p><form id="login-form"><label>用户名<input name="username" autocomplete="username" value="admin" required></label><label>管理密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form><small>首次运行：pnpm configure:admin<br>凭据保存在本机 .dev.vars，不会发送给主题。</small></section>
<div id="workspace" hidden><section id="active" class="active panel"></section><div class="section-title"><div><h2 id="section-title">已安装版本</h2><p id="section-note">资源和协议一起切换。已打开的旧页面继续使用原版本。</p></div><button id="refresh" class="secondary">刷新</button></div><div id="cards" class="cards"></div><p class="footnote">“已发现”仅表示目录收录；安装会校验固定版本、许可证与静态资源。“实测兼容”只对应已验收的具体包，不代表整个生态。</p></div>
</main></div><script type="module" src="/app.js"></script></body></html>
