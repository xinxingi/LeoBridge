name: leobridge

services:
  app:
    image: staractive/leobridge:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - '${LEOBRIDGE_BIND_HOST:-127.0.0.1}:${LEOBRIDGE_PORT:-8787}:8787'
    environment:
      NODE_ENV: production
      BRIDGE_NODE_MODE: ${BRIDGE_NODE_MODE:-direct}
      BRIDGE_ROUTING: ${BRIDGE_ROUTING:-single}
      BRIDGE_LISTEN_HOST: 0.0.0.0
      BRIDGE_LISTEN_PORT: '8787'
      BRIDGE_ORIGIN: ${BRIDGE_ORIGIN:-http://127.0.0.1:${LEOBRIDGE_PORT:-8787}}
      BRIDGE_THEME_STORE: /data/theme-store
      BRIDGE_ACCESS: ${BRIDGE_ACCESS:-public}
      BRIDGE_TITLE: ${BRIDGE_TITLE:-LeoBridge}
      BRIDGE_USERNAME: ${BRIDGE_USERNAME:-}
      BRIDGE_PASSWORD: ${BRIDGE_PASSWORD:-}
      BRIDGE_ADMIN_USERNAME: ${BRIDGE_ADMIN_USERNAME:-admin}
      # Optional application settings for an independently managed reverse proxy.
      BRIDGE_TRUSTED_PROXIES: ${BRIDGE_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      BRIDGE_ADMIN_ORIGIN: ${BRIDGE_ADMIN_ORIGIN:-}
      BRIDGE_DISPLAY_DOMAIN: ${BRIDGE_DISPLAY_DOMAIN:-display.localhost}
      BRIDGE_PREVIEW_ORIGIN: ${BRIDGE_PREVIEW_ORIGIN:-}
    volumes:
      - theme-store:/data/theme-store
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  theme-store:
    name: ${THEME_STORE_VOLUME:-leobridge-theme-store}
