name: leobridge

# 首次启动前创建可写目录（以 root 或 sudo 执行）：
# mkdir -p data tmp && chown 1000:1000 data tmp && chmod 700 data tmp

services:
  app:
    image: staractive/leobridge:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      # 浏览器实际访问地址；HTTPS 由 nginx/Caddy 提供
      # BRIDGE_ORIGIN: https://[你的域名]
      BRIDGE_ORIGIN: http://127.0.0.1:8787
    # 数据就在 compose.yaml 旁边的 data 目录；不是 Docker 命名卷。
    volumes:
      - ./data:/data
      - ./tmp:/tmp # 下载、解压和构建的临时文件，使用当前目录的磁盘空间。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
