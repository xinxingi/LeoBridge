# Linux-only private acceptance environment. Every listener is loopback-only.
# Supply an already-built image and a private Node dotenv file; no source build.
name: leobridge-ssh-test
services:
  app:
    image: ${LEOBRIDGE_IMAGE:?Set an already-built image tag or digest}
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      NODE_ENV: production
      BRIDGE_NODE_MODE: local
      BRIDGE_LISTEN_HOST: 127.0.0.1
      BRIDGE_ACCESS: local
      BRIDGE_ADMIN_ORIGIN: http://vps-admin.localhost:18886
      BRIDGE_DISPLAY_ORIGIN: http://vps-monitor.localhost:18887
      BRIDGE_DISPLAY_DOMAIN: vps-themes.localhost
      BRIDGE_PREVIEW_ORIGIN: http://vps-preview.localhost:18889
      BRIDGE_THEME_STORE: /data/theme-store
      BRIDGE_ENV_FILE: /run/leobridge/runtime.env
    volumes:
      - ${BRIDGE_PRIVATE_ENV_FILE:?Set an absolute private Node dotenv file path}:/run/leobridge/runtime.env:ro
      - theme-store:/data/theme-store
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18887/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  theme-store:
    name: ${THEME_STORE_VOLUME:-leobridge-ssh-test-store}
