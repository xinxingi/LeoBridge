name: Docker and Release packages

# Publishing is triggered only by a pushed version tag, never by a branch or PR.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      node: ${{ steps.version.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag, package version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p process.version)" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/check.yml

  packages:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.version.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:runtime
        env:
          BRIDGE_TEST_BUILT_NODE: '1'
      - name: Download and verify the exact Node runtime
        env:
          NODE_VERSION: ${{ needs.version.outputs.node }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = "$TARGET_ARCH"
          mkdir -p work/release-node
          cd work/release-node
          archive="node-$NODE_VERSION-linux-$TARGET_ARCH.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt" -o SHASUMS256.txt
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            "https://nodejs.org/dist/$NODE_VERSION/$archive" -o "$archive"
          awk -v file="$archive" '$2 == file {print}' SHASUMS256.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          mkdir runtime
          tar -xzf "$archive" --strip-components=1 -C runtime
      - name: Package and verify the real archive without system Node
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          pnpm package:local --node-dir work/release-node/runtime --out-dir work/release
          node scripts/verify-release.mjs package "work/release/leobridge-$RELEASE_VERSION-linux-$TARGET_ARCH.tar.gz"
      - name: Verify native container runtime
        run: |
          docker build --tag leobridge:release-check --file deploy/docker/Dockerfile .
          node scripts/verify-release.mjs image leobridge:release-check
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            work/release/*.tar.gz
            work/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Docker Hub account
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: test "$DOCKERHUB_USERNAME" = staractive
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned multi-platform image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: staractive/leobridge:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/xinxingi/LeoBridge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published manifest
        env:
          IMAGE: staractive/leobridge:${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > manifest.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            for (const arch of ["amd64", "arm64"]) {
              assert.ok(manifest.manifests.some(item => item.platform?.os === "linux" && item.platform.architecture === arch));
            }
          '
          docker pull "$IMAGE@$DIGEST"
          node scripts/verify-release.mjs image "$IMAGE@$DIGEST"
          echo "Published: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest after image verification
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          IMAGE: staractive/leobridge:${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_VERSION" == *-* ]]; then exit 0; fi
          docker buildx imagetools create --tag staractive/leobridge:latest "$IMAGE@$DIGEST"
          docker buildx imagetools inspect staractive/leobridge:latest
          echo "Updated: \`staractive/leobridge:latest\` from \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [version, packages, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete package set
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          for arch in x64 arm64; do
            sha256sum --check "leobridge-$RELEASE_VERSION-linux-$arch.tar.gz.sha256"
          done
          cat *.sha256 > checksums.txt
          cp ../deploy/docker/compose.yaml compose.yaml
      - name: Create or reuse release and upload verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          # Include drafts and every page. A failed query stops before any mutation.
          release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$RELEASE_TAG" <<< "$release_tags"; then
            # Keep existing release notes, title and draft/prerelease status.
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            exit 0
          fi
          printf 'Docker Hub: `staractive/leobridge:%s`\n\nImage digest: `%s`\n\nLinux x64/arm64 archives include Node and production dependencies. Download the matching archive and checksum file.\n' \
            "$RELEASE_VERSION" "$IMAGE_DIGEST" > release-notes.md
          args=(--verify-tag --title "LeoBridge $RELEASE_TAG" --notes-file release-notes.md --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
